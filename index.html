<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1713" media="(prefers-color-scheme: dark)" />
    <title>Earneazi — Financial planning made simple</title>
    <meta
      name="description"
      content="Earneazi — mutual funds & PMS, insurance, and loans, planned around your goals."
    />

    <!--
      Sets data-theme before first paint so there's no flash of the wrong
      theme while React mounts (Phase 0 Blueprint, Section I). Kept in sync
      afterwards by ThemeProvider (src/lib/theme/ThemeProvider.tsx).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('earneazi-theme-preference');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var mode = stored === 'light' || stored === 'dark' ? stored : systemDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three families, three jobs (Phase 2 Blueprint, "Visual Direction"):
        Fraunces        display/headlines. Loaded as a variable font including
                        the SOFT and WONK axes so headlines can use the sharper,
                        slightly wonky editorial cut rather than the neutral
                        default instance (see .font-display-wonk in globals.css).
                        `opsz` is left on `auto`, so large sizes automatically
                        pick up the display optical size.
        Inter           body + interface text.
        JetBrains Mono  small numeric/technical labels only — step numbers and
                        the SIP illustration caption. Not used as decoration.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
